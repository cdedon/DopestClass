<!DOCTYPE html>
<html>

<head>

<title>My Beat Store</title>

<style>

body{
background:#0f0f0f;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}

.beat{
background:#1a1a1a;
padding:20px;
margin:20px auto;
width:300px;
border-radius:10px;
}

button{
background:#ff3c3c;
border:none;
padding:10px;
color:white;
cursor:pointer;
}

button:hover{
background:red;
}

</style>

</head>

<body>

<h1>My Beat Store</h1>

<div class="beat">

<h2>Trap Beat 1</h2>

<audio controls>
<source src="beats/trap1.mp3">
</audio>

<p>140 BPM | F Minor</p>

<button>Buy License</button>

</div>


<div class="beat">

<h2>Drill Beat</h2>

<audio controls>
<source src="beats/drill1.mp3">
</audio>

<p>150 BPM | D Minor</p>

<button>Buy License</button>

</div>

</body>

</html>
